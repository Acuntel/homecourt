services:
  postgres:
    image: postgres:15-alpine
    container_name: homecourt-postgres
    environment:
      POSTGRES_USER: homecourt
      POSTGRES_PASSWORD: homecourt
      POSTGRES_DB: homecourt
    ports:
      - "5432:5432"
    volumes:
      - homecourt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecourt -d homecourt"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: homecourt-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: homecourt-engine
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      # Note: in this docker-compose file we still ship a `postgres` service for
      # parity, but the M2/M3 local stack uses Supabase's containers on
      # 127.0.0.1:54322. Override DATABASE_URL when running engine alongside
      # the supabase stack.
      DATABASE_URL: postgresql://homecourt:homecourt@postgres:5432/homecourt
      NATS_URL: nats://nats:4222
      ENGINE_PORT: "8080"
      ENGINE_JWKS_URL: http://supabase_kong_homecourt:8000/auth/v1/.well-known/jwks.json
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  homecourt_pg_data:
